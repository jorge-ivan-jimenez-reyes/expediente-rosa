services:
  valkey:
    image: valkey/valkey:8
    command: ["valkey-server", "--appendonly", "yes"]
    ports: ["6379:6379"]
    volumes: [valkey:/data]
  api:
    image: node:20-alpine
    working_dir: /api
    command: sh -c "corepack enable && pnpm install --frozen-lockfile && pnpm start"
    environment:
      VALKEY_URL: redis://valkey:6379
      PORT: "8787"
    ports: ["8787:8787"]
    volumes: [./api:/api, /api/node_modules]
    depends_on: [valkey]
volumes:
  valkey:
