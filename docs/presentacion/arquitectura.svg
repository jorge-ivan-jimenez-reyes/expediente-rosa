<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 920" width="1600" height="920" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif">
  <title>Expediente Rosa: arquitectura</title>
  <defs>
    <symbol id="candado" viewBox="0 0 20 24">
      <path d="M5 11 V7 a5 5 0 0 1 10 0 V11" fill="none" stroke="#C4006A" stroke-width="2.4" stroke-linecap="round"/>
      <rect x="1.5" y="10.5" width="17" height="12.5" rx="3" fill="#C4006A"/>
      <circle cx="10" cy="16.2" r="1.8" fill="#FFFFFF"/>
    </symbol>
    <marker id="flecha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#C4006A"/>
    </marker>
    <marker id="flechaGris" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#6E6E73"/>
    </marker>
    <style>
      .t { fill: #1D1D1F; }
      .g { fill: #6E6E73; }
      .r { fill: #C4006A; }
      .mono { font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace; }
      .h1 { font-size: 24px; font-weight: 700; }
      .h2 { font-size: 18px; font-weight: 700; }
      .b { font-size: 15px; }
      .s { font-size: 13.5px; }
      .tipo { font-size: 13px; font-weight: 700; letter-spacing: 0.04em; }
      .card { fill: #FFFFFF; stroke: #D2D2D7; stroke-width: 1.2; }
      .vk { fill: #F5F5F7; stroke: #D2D2D7; stroke-width: 1.2; }
      .seguro { fill: #FCE4EF; stroke: #C4006A; stroke-width: 1.4; }
      .chip { fill: #FFFFFF; stroke: #C4006A; stroke-width: 1; }
    </style>
  </defs>

  <rect width="1600" height="920" fill="#FFFFFF"/>

  <!-- Encabezado -->
  <text x="40" y="52" class="t h1" font-size="26">Expediente Rosa · arquitectura</text>
  <use href="#candado" x="1318" y="34" width="17" height="21"/>
  <text x="1342" y="51" class="g b">= no sale del teléfono</text>

  <!-- ===================== iPhone ===================== -->
  <rect x="40" y="82" width="520" height="610" rx="40" fill="#FFFFFF" stroke="#1D1D1F" stroke-width="2.5"/>
  <rect x="250" y="94" width="100" height="10" rx="5" fill="#1D1D1F"/>
  <text x="68" y="140" class="t h1">iPhone · iOS 26</text>
  <text x="68" y="163" class="g b">funciona completo sin señal</text>

  <!-- SwiftUI + SwiftData -->
  <rect x="64" y="180" width="472" height="112" rx="14" class="card"/>
  <text x="84" y="208" class="t h2">SwiftUI + SwiftData</text>
  <text x="84" y="233" class="t b">Pacientes y estudios guardados en el teléfono</text>
  <text x="84" y="256" class="t b">Cola de eventos <tspan class="mono s">alta</tspan> · <tspan class="mono s">estudio</tspan>, cada uno</text>
  <text x="84" y="278" class="t b">con llave UUID única (se guarda junto con el registro)</text>

  <!-- Vision + Foundation Models -->
  <rect x="64" y="306" width="472" height="150" rx="14" class="seguro"/>
  <use href="#candado" x="84" y="320" width="17" height="21"/>
  <text x="110" y="337" class="t h2">Vision + Foundation Models</text>
  <text x="84" y="362" class="t b">Modelo de Apple dentro del teléfono, sin red</text>
  <rect x="84" y="378" width="104" height="30" rx="15" class="chip"/>
  <text x="136" y="398" class="r s" text-anchor="middle">leer hoja</text>
  <rect x="198" y="378" width="186" height="30" rx="15" class="chip"/>
  <text x="291" y="398" class="r s" text-anchor="middle">explicar coincidencia</text>
  <rect x="394" y="378" width="122" height="30" rx="15" class="chip"/>
  <text x="455" y="398" class="r s" text-anchor="middle">resumir</text>
  <rect x="84" y="416" width="134" height="30" rx="15" class="chip"/>
  <text x="151" y="436" class="r s" text-anchor="middle">dictar estudio</text>
  <text x="232" y="436" class="g s">sin Apple Intelligence, todo lo demás sigue</text>

  <!-- Firma -->
  <rect x="64" y="470" width="472" height="62" rx="14" class="seguro"/>
  <use href="#candado" x="84" y="484" width="17" height="21"/>
  <text x="110" y="500" class="t h2">Firma del consentimiento</text>
  <text x="110" y="521" class="g s">el trazo queda en el teléfono; al servidor solo va la fecha</text>

  <!-- Coincidencias -->
  <rect x="64" y="546" width="472" height="124" rx="14" class="card"/>
  <text x="84" y="574" class="t h2">Coincidencias</text>
  <text x="84" y="599" class="t b">Jaro-Winkler + fonética del español</text>
  <text x="84" y="622" class="g s mono">b/v · s/z · ll/y · h muda · Ma. · Lupe · Hdz</text>
  <text x="84" y="648" class="g s">umbral 0.82 · mismo algoritmo en Swift y en la API</text>

  <!-- ===================== Roles ===================== -->
  <text x="40" y="728" class="t h2">Roles</text>
  <text x="100" y="728" class="g s">selector en la app, sin login en esta versión</text>

  <rect x="40" y="742" width="166" height="140" rx="14" class="card"/>
  <text x="56" y="768" class="t h2">Enfermería</text>
  <text x="56" y="789" class="r s">captura</text>
  <text x="56" y="814" class="t s">alta, firma, busca</text>
  <text x="56" y="834" class="t s">y escanea hojas</text>
  <text x="56" y="862" class="g s">no ve resultados</text>

  <rect x="217" y="742" width="166" height="140" rx="14" class="card"/>
  <text x="233" y="768" class="t h2">Médico</text>
  <text x="233" y="789" class="r s">consulta clínica</text>
  <text x="233" y="814" class="t s">ve resultados</text>
  <text x="233" y="834" class="t s">y el resumen</text>
  <text x="233" y="862" class="g s">agrega estudios</text>

  <rect x="394" y="742" width="166" height="140" rx="14" class="card"/>
  <text x="410" y="768" class="t h2">Coordinadora</text>
  <text x="410" y="789" class="r s">administración</text>
  <text x="410" y="814" class="t s">duplicados:</text>
  <text x="410" y="834" class="t s">une o separa</text>
  <text x="410" y="862" class="g s">conflictos (API)</text>

  <!-- ===================== Conexión ===================== -->
  <rect x="580" y="92" width="170" height="30" rx="15" fill="#FFFFFF" stroke="#6E6E73" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="665" y="112" class="g s" text-anchor="middle">hasta 3 días sin señal</text>
  <line x1="562" y1="146" x2="766" y2="146" stroke="#C4006A" stroke-width="3" marker-end="url(#flecha)"/>
  <text x="663" y="172" class="r mono" font-size="14" font-weight="700" text-anchor="middle">POST /api/sync</text>
  <text x="663" y="192" class="g s" text-anchor="middle">al volver la señal,</text>
  <text x="663" y="209" class="g s" text-anchor="middle">lotes de 100</text>

  <line x1="768" y1="224" x2="566" y2="224" stroke="#6E6E73" stroke-width="2" marker-end="url(#flechaGris)"/>
  <text x="663" y="250" class="t mono" font-size="13" text-anchor="middle">GET /api/pacientes</text>
  <text x="663" y="268" class="t mono" font-size="13" text-anchor="middle">?comunidad=</text>
  <text x="663" y="289" class="g s" text-anchor="middle">«Preparar jornada»:</text>
  <text x="663" y="307" class="g s" text-anchor="middle">baja las pacientes</text>
  <text x="663" y="325" class="g s" text-anchor="middle">antes de salir</text>

  <!-- ===================== API ===================== -->
  <rect x="770" y="82" width="790" height="150" rx="16" fill="#FFFFFF" stroke="#1D1D1F" stroke-width="2"/>
  <text x="794" y="118" class="t h1">API Hono · Node 20</text>
  <text x="794" y="145" class="t b">Valida con zod, aplica cada evento una vez y busca duplicados al dar de alta</text>
  <rect x="794" y="160" width="250" height="28" rx="6" fill="#1D1D1F"/>
  <text x="919" y="179" fill="#FFFFFF" class="s" font-weight="600" text-anchor="middle">AES-256-GCM (CLAVE_DATOS)</text>
  <text x="1056" y="179" class="t s">nota del estudio y consentimiento cifrados en reposo</text>
  <text x="794" y="214" class="g mono" font-size="12.5">/buscar · /duplicados · /conflictos · /seguimiento · /bitacora · /jornada/:c/en-vivo</text>

  <line x1="1165" y1="232" x2="1165" y2="268" stroke="#C4006A" stroke-width="3" marker-end="url(#flecha)"/>

  <!-- ===================== Valkey ===================== -->
  <rect x="770" y="270" width="790" height="612" rx="16" class="vk"/>
  <text x="794" y="306" class="t h1">Valkey</text>
  <text x="884" y="306" class="g b">imagen valkey-bundle (valkey-search); sin el módulo, la búsqueda usa los sets de bloque</text>

  <!-- fila 1 -->
  <rect x="790" y="326" width="367" height="102" rx="12" class="card"/>
  <text x="808" y="352" class="r tipo mono">SET NX · EX 30 días</text>
  <text x="808" y="374" class="g mono" font-size="13">sync:envio:&lt;llave&gt;</text>
  <text x="808" y="400" class="t b">Idempotencia: reenviar no duplica</text>
  <text x="808" y="419" class="g s">la llave UUID que puso el teléfono</text>

  <rect x="1173" y="326" width="367" height="102" rx="12" class="card"/>
  <text x="1191" y="352" class="r tipo mono">HASH + version · EVAL Lua</text>
  <text x="1191" y="374" class="g mono" font-size="13">paciente:&lt;id&gt;</text>
  <text x="1191" y="400" class="t b">Ficha con versión; compara y aplica</text>
  <text x="1191" y="419" class="g s">en un solo paso, dos envíos no se pisan</text>

  <!-- fila 2 -->
  <rect x="790" y="436" width="367" height="102" rx="12" class="card"/>
  <text x="808" y="462" class="r tipo mono">LIST · HASH + ZSET</text>
  <text x="808" y="484" class="g mono" font-size="13">paciente:&lt;id&gt;:estudios · :visitas</text>
  <text x="808" y="510" class="t b">Estudios y visitas por separado</text>
  <text x="808" y="529" class="g s">visitas ordenadas por fecha</text>

  <rect x="1173" y="436" width="367" height="102" rx="12" class="card"/>
  <text x="1191" y="462" class="r tipo mono">SET por bloque</text>
  <text x="1191" y="484" class="g mono" font-size="13">bloque:ap:&lt;fonético&gt; · ap-anio:…</text>
  <text x="1191" y="510" class="t b">Compara solo contra candidatas</text>
  <text x="1191" y="529" class="g s">mismo apellido fonético o apellido + año</text>

  <!-- fila 3 -->
  <rect x="790" y="546" width="367" height="102" rx="12" class="card"/>
  <text x="808" y="572" class="r tipo mono">VECTOR HNSW · valkey-search</text>
  <text x="808" y="594" class="g mono" font-size="13">idx:pacientes · 128 dims · coseno</text>
  <text x="808" y="620" class="t b">Búsqueda por similitud del nombre</text>
  <text x="808" y="639" class="g s">KNN sobre trigramas fonéticos, sin embeddings</text>

  <rect x="1173" y="546" width="367" height="102" rx="12" class="card"/>
  <text x="1191" y="572" class="r tipo mono">ZSET por puntaje</text>
  <text x="1191" y="594" class="g mono" font-size="13">duplicados</text>
  <text x="1191" y="620" class="t b">Posibles duplicados ≥ 0.82</text>
  <text x="1191" y="639" class="g s">decide la coordinadora; nunca se unen solas</text>

  <!-- fila 4 -->
  <rect x="790" y="656" width="367" height="102" rx="12" class="card"/>
  <text x="808" y="682" class="r tipo mono">ZSET por fecha límite</text>
  <text x="808" y="704" class="g mono" font-size="13">seguimiento</text>
  <text x="808" y="730" class="t b">Anormales a 15 días, vencidos primero</text>
  <text x="808" y="749" class="g s">BI-RADS 3 o evaluación: 6 meses</text>

  <rect x="1173" y="656" width="367" height="102" rx="12" class="card"/>
  <text x="1191" y="682" class="r tipo mono">ZSET por fecha</text>
  <text x="1191" y="704" class="g mono" font-size="13">conflictos</text>
  <text x="1191" y="730" class="t b">Cambios sobre una versión vieja</text>
  <text x="1191" y="749" class="g s">no se aplican: esperan a la coordinadora</text>

  <!-- fila 5 -->
  <rect x="790" y="766" width="367" height="102" rx="12" class="card"/>
  <text x="808" y="792" class="r tipo mono">STREAM</text>
  <text x="808" y="814" class="g mono" font-size="13">eventos</text>
  <text x="808" y="840" class="t b">Bitácora: quién, qué, cuándo</text>
  <text x="808" y="859" class="g s">sin resultados, notas ni valores de campos</text>

  <rect x="1173" y="766" width="367" height="102" rx="12" class="card"/>
  <text x="1191" y="792" class="r tipo mono">PUB/SUB → SSE</text>
  <text x="1191" y="814" class="g mono" font-size="13">canal:jornada:&lt;comunidad&gt;</text>
  <text x="1191" y="840" class="t b">Conteo de la jornada en vivo</text>
  <text x="1191" y="859" class="g s">altas, estudios por tipo y duplicados del día</text>
</svg>
